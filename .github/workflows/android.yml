name: Build Wulkanizacja APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
- name: Android SDK
  uses: android-actions/setup-android@v4
      

      - name: Zainstaluj SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Buduj APK
        working-directory: wulkanizacja/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Wulkanizacja-APK
          path: wulkanizacja/android/app/build/outputs/apk/debug/app-debug.apk
